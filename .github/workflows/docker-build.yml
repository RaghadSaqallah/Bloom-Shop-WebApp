name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: bloom-shop:ci

      - name: Run container and smoke test
        run: |
          docker run -d --name bloom-shop -p 8080:80 bloom-shop:ci
          sleep 5
          curl --fail --silent --head http://localhost:8080/
          curl --fail --silent --head http://localhost:8080/order.html
          curl --fail --silent --head http://localhost:8080/cart.html